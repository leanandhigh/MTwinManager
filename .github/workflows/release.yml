name: Release

# On a v* tag, or by hand (Actions > Release > Run workflow): builds the installer, signs it for
# the app's self-updater (MTwinManager-Setup-<version>.exe.sig, ECDSA P-256 with the MTWIN_UPDATE_KEY
# secret), then puts both with their SHA-256 on a draft release v<version>. Nothing is published:
# a maintainer reviews the draft and publishes it, which creates the tag when a manual run made it.
#
# Every push to the Progress branch is released too, published straight away as 1.2.<run number>,
# so every MTwin Manager built from a release updates itself to it (Settings > About > Check now, or
# within 6 hours). Needs the MTWIN_UPDATE_KEY secret (scripts/make-update-key.mjs).
on:
  push:
    tags: ["v*"]
    branches: ["claude/sleepy-edison-wz3daw"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.0 (empty: the one in tauri.conf.json). Must be newer than what you run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      signed: ${{ env.HAS_SIGNPATH }}
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version asked for
        if: (github.event_name == 'workflow_dispatch' && inputs.version != '') || github.ref_type == 'branch' && github.event_name == 'push'
        env:
          WANT: ${{ inputs.version || format('1.2.{0}', github.run_number) }}
        run: |
          if ($env:WANT -notmatch '^\d+\.\d+\.\d+$') { echo "::error::version '$env:WANT' isn't like 1.2.0"; exit 1 }
          $files = @{
            'src-tauri\tauri.conf.json' = '("version"\s*:\s*)"[^"]+"'
            'package.json'              = '("version"\s*:\s*)"[^"]+"'
            'src-tauri\Cargo.toml'      = '(?m)^(version\s*=\s*)"[^"]+"'
            'src-tauri\Cargo.lock'      = '(name = "mtwin-manager"\r?\nversion = )"[^"]+"'
          }
          foreach ($f in $files.Keys) {
            $text = [IO.File]::ReadAllText($f)
            $new = ([regex]$files[$f]).Replace($text, ('$1"' + $env:WANT + '"'), 1)
            if ($new -eq $text) { echo "::error::could not set the version in $f"; exit 1 }
            [IO.File]::WriteAllText($f, $new)
          }
          echo "version set to $env:WANT"
      - id: v
        run: |
          $version = (Get-Content -Raw src-tauri\tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            echo "::error::tag $env:GITHUB_REF_NAME is not v$version, the version in src-tauri/tauri.conf.json: tag v$version instead, or set the version in tauri.conf.json, package.json and src-tauri/Cargo.toml first"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with the update key's public half
        # The app only runs installers signed by the key whose public half it carries: put the public
        # half of MTWIN_UPDATE_KEY into self_update.rs before building, so they always match.
        env:
          MTWIN_UPDATE_KEY: ${{ secrets.MTWIN_UPDATE_KEY }}
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const key = process.env.MTWIN_UPDATE_KEY;
            if (!key) { console.log("::error::the MTWIN_UPDATE_KEY secret is not set (scripts/make-update-key.mjs makes one)"); process.exit(1); }
            const jwk = crypto.createPublicKey(key).export({ format: "jwk" });
            if (jwk.crv !== "P-256") { console.log("::error::MTWIN_UPDATE_KEY is not a P-256 key"); process.exit(1); }
            const hex = Buffer.concat([Buffer.from(jwk.x, "base64url"), Buffer.from(jwk.y, "base64url")]).toString("hex");
            const file = "src-tauri/src/self_update.rs";
            const src = fs.readFileSync(file, "utf8").replace(/const PUBLIC_KEY: &str = "[0-9a-f]{128}"/, `const PUBLIC_KEY: &str = "${hex}"`);
            fs.writeFileSync(file, src);
            console.log("update key: " + hex);
          '
        shell: bash
      - name: Inno Setup 6.6+
        # Installs it, or upgrades a preinstalled older 6.x (the .iss needs 6.6).
        run: choco upgrade innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      # Optional, until SignPath has approved the project: SIGNPATH_API_TOKEN (secret) and
      # SIGNPATH_ORGANIZATION_ID (variable). Before the updater's signature, which covers the
      # installer's exact bytes.
      - uses: actions/upload-artifact@v7
        id: unsigned
        if: env.HAS_SIGNPATH == 'true'
        with:
          name: unsigned
          path: dist-installer/MTwinManager-Setup-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@v2
        if: env.HAS_SIGNPATH == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: MTwinManager
          signing-policy-slug: release-signing
          artifact-configuration-slug: github-ci
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: env.HAS_SIGNPATH == 'true'
        run: Copy-Item "dist-signed\MTwinManager-Setup-${{ steps.v.outputs.version }}.exe" dist-installer\ -Force
      - name: Sign the installer for the self-updater
        # The key (a PKCS#8 PEM P-256 private key) reaches Node only through the environment and is
        # never printed. Signed: "MTwinManager-Setup-<version>.exe\n" then the installer's bytes, so the
        # version can't be swapped. The signature is IEEE P1363 (r||s, 64 bytes) in base64: what
        # the app checks, and it is checked here against the PUBLIC_KEY in self_update.rs first.
        env:
          MTWIN_UPDATE_KEY: ${{ secrets.MTWIN_UPDATE_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const key = process.env.MTWIN_UPDATE_KEY;
            if (!key) { console.log("::error::the MTWIN_UPDATE_KEY secret is not set: the installer cannot be signed"); process.exit(1); }
            const hex = fs.readFileSync("src-tauri/src/self_update.rs", "utf8").match(/const PUBLIC_KEY: &str = "([0-9a-f]{128})"/)[1];
            const xy = Buffer.from(hex, "hex"), b64 = (b) => b.toString("base64url");
            const pub = crypto.createPublicKey({ key: { kty: "EC", crv: "P-256", x: b64(xy.subarray(0, 32)), y: b64(xy.subarray(32)) }, format: "jwk" });
            const built = `dist-installer/MTwinManager-Setup-${process.env.VERSION}.exe`;
            {
              const name = `MTwinManager-Setup-${process.env.VERSION}.exe`, exe = built;
              const data = Buffer.concat([Buffer.from(name + "\n"), fs.readFileSync(exe)]);
              const sig = crypto.sign("sha256", data, { key, dsaEncoding: "ieee-p1363" });
              if (!crypto.verify("sha256", data, { key: pub, dsaEncoding: "ieee-p1363" }, sig)) {
                console.log("::error::MTWIN_UPDATE_KEY is not the key whose public half is PUBLIC_KEY in self_update.rs: the app would refuse this installer");
                process.exit(1);
              }
              fs.writeFileSync(exe + ".sig", sig.toString("base64"));
              console.log("signed " + exe);
            }
          '
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist-installer/MTwinManager-Setup-${{ steps.v.outputs.version }}.exe
            dist-installer/MTwinManager-Setup-${{ steps.v.outputs.version }}.exe.sig
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Draft release with SHA-256 sums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.windows.outputs.tag }}
          VERSION: ${{ needs.windows.outputs.version }}
          SIGNED: ${{ needs.windows.outputs.signed }}
          # The Progress branch publishes at once (that's what reaches the self-updater), whether
          # pushed or run by hand; tags and runs on other branches stay drafts to review.
          PUBLISH: ${{ github.ref == 'refs/heads/claude/sleepy-edison-wz3daw' }}
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s "MTwinManager-Setup-$VERSION.exe.sig" || { echo "::error::MTwinManager-Setup-$VERSION.exe.sig is missing"; exit 1; }
          signing="No Authenticode signature yet: SmartScreen warns."
          if [ "$SIGNED" = true ]; then signing="Code signed."; fi
          cat > ../notes.md <<EOF
          $signing The SHA-256 sums are below and in SHA256SUMS.txt; MTwinManager-Setup-$VERSION.exe.sig is the signature the built-in updater checks before it runs the installer.

          - **Windows** 10 1809 or later, or Windows 11, x64: MTwinManager-Setup-$VERSION.exe. SmartScreen warns on first run: More info → Run anyway.
          - Needs the Microsoft Edge WebView2 Runtime (Windows 11 has it). Setup checks, and offers Microsoft's download when it is missing.

          ~~~
          $(cat SHA256SUMS.txt)
          ~~~
          EOF
          # A manual run must not attach a build of one commit to a tag on another.
          if tag_sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null) && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG is at $tag_sha, not $GITHUB_SHA: raise the version, or run the workflow from the tag"
            exit 1
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published: raise the version for a new release"
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file ../notes.md
          else
            if [ "$PUBLISH" = true ]; then
              gh release create "$TAG" ./* --latest --target "$GITHUB_SHA" --title "MTwin Manager $VERSION" --notes-file ../notes.md
            else
              gh release create "$TAG" ./* --draft --target "$GITHUB_SHA" --title "MTwin Manager $VERSION" --notes-file ../notes.md
            fi
          fi
